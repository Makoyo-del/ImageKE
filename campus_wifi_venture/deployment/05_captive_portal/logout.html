<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logged Out — Makoyocart CampusNet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #090a0e;
            --bg-card: rgba(17, 19, 26, 0.94);
            --brand-orange: #ff5414;
            --brand-orange-hover: #ff6f38;
            --brand-orange-glow: rgba(255, 84, 20, 0.45);
            --brand-ember: #e03a00;
            --text-pure: #ffffff;
            --text-high: #f1f5f9;
            --text-mid: #cbd5e1;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(circle at 80% 15%, rgba(255, 84, 20, 0.22) 0%, transparent 60%),
                radial-gradient(circle at 20% 85%, rgba(255, 152, 0, 0.12) 0%, transparent 50%);
            color: var(--text-high);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            text-align: center;
            line-height: 1.6;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: blur(28px);
            border: 1.5px solid var(--border-glass);
            border-radius: 28px;
            padding: 34px 24px;
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(255, 84, 20, 0.15);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--brand-orange), transparent);
            border-radius: 0 0 4px 4px;
        }

        .edition-badge {
            display: inline-block;
            background: var(--brand-orange);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(255, 84, 20, 0.12);
            border: 1.5px solid rgba(255, 84, 20, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 26px;
            color: var(--brand-orange);
            box-shadow: 0 0 20px rgba(255, 84, 20, 0.3);
        }

        .title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
            color: var(--text-pure);
        }

        .title span {
            color: var(--brand-orange);
        }

        .sub {
            font-size: 13.5px;
            color: var(--text-mid);
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
            text-align: left;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid var(--border-glass);
            border-radius: 14px;
            padding: 12px 14px;
        }

        .stat-box .label {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-bottom: 3px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-box .val {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-pure);
        }

        .btn-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, var(--brand-ember) 0%, var(--brand-orange) 100%);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 25px -4px var(--brand-orange-glow);
            transition: all 0.2s;
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px -4px rgba(255, 84, 20, 0.6);
        }

        .support-box {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border-glass);
            font-size: 12.5px;
            color: var(--text-mid);
        }

        .support-box strong {
            color: var(--text-pure);
        }

        .support-phone {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--brand-orange);
            font-weight: 800;
            text-decoration: none;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <span class="edition-badge">THE 2026 EDITION</span>
    <div class="icon-box">🔒</div>

    <h1 class="title">Session <span>Completed</span></h1>
    <p class="sub">You have disconnected from <strong>Makoyocart CampusNet</strong>.</p>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="label">Total Uptime</div>
            <div class="val" id="stat-uptime">$(uptime)</div>
        </div>
        <div class="stat-box">
            <div class="label">Data Downloaded</div>
            <div class="val" id="stat-bytes">$(bytes-out-nice)</div>
        </div>
        <div class="stat-box">
            <div class="label">Device IP</div>
            <div class="val" id="stat-ip">$(ip)</div>
        </div>
        <div class="stat-box">
            <div class="label">Device MAC</div>
            <div class="val" id="stat-mac" style="font-size:12px; font-family:monospace;">$(mac)</div>
        </div>
    </div>

    <a id="btn-reconnect" href="login.html" class="btn-cta">
        ⚡ Log Back In / Extend Pass
    </a>

    <div class="support-box">
        <strong>Makoyocart Ventures</strong> • Reg: BN-WLSP9KP9<br>
        24/7 Helpline: <a class="support-phone" href="tel:0794877125">📞 0794877125</a> • Kisii
    </div>
</div>

<script>
    (function() {
        var fields = [
            { id: 'stat-uptime', preview: '45m 12s' },
            { id: 'stat-bytes', preview: '218.4 MB' },
            { id: 'stat-ip', preview: '192.168.88.254' },
            { id: 'stat-mac', preview: '6C:29:95:A1:B2:C3' }
        ];
        fields.forEach(function(item) {
            var el = document.getElementById(item.id);
            if (el) {
                var v = el.innerText.trim();
                if (!v || v.indexOf('$(') !== -1 || v.startsWith('$(')) {
                    el.innerText = item.preview;
                }
            }
        });
        var loginUrl = "$(link-login)";
        if (loginUrl && loginUrl.indexOf('$(') === -1) {
            document.getElementById('btn-reconnect').setAttribute('href', loginUrl);
        }
    })();
</script>

</body>
</html>
