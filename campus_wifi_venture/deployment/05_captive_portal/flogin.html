<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login Failed — Makoyocart CampusNet</title>
    <meta http-equiv="refresh" content="3; url=$(link-login)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #090a0e;
            --bg-card: rgba(17, 19, 26, 0.94);
            --brand-orange: #ff5414;
            --brand-orange-hover: #ff6f38;
            --brand-orange-glow: rgba(255, 84, 20, 0.45);
            --brand-ember: #e03a00;
            --text-pure: #ffffff;
            --text-high: #f1f5f9;
            --text-mid: #cbd5e1;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(255, 84, 20, 0.22) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(239, 68, 68, 0.14) 0%, transparent 50%);
            color: var(--text-high);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            text-align: center;
            line-height: 1.6;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: blur(28px);
            border: 1.5px solid var(--border-glass);
            border-radius: 28px;
            padding: 34px 24px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ef4444, transparent);
            border-radius: 0 0 4px 4px;
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(239, 68, 68, 0.12);
            border: 1.5px solid rgba(239, 68, 68, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 26px;
            color: #ef4444;
        }

        .title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--text-pure);
        }

        .title span {
            color: var(--brand-orange);
        }

        .sub {
            font-size: 13.5px;
            color: var(--text-mid);
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .btn-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, var(--brand-ember) 0%, var(--brand-orange) 100%);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 25px -4px var(--brand-orange-glow);
        }

        .support-box {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border-glass);
            font-size: 12px;
            color: var(--text-muted);
        }

        .support-box a {
            color: var(--brand-orange);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-box">✕</div>
    <h1 class="title">Login <span>Unsuccessful</span></h1>
    <p class="sub" id="err-text">$(error)</p>

    <a id="return-btn" href="login.html" class="btn-cta">
        ⚡ Return to Login
    </a>

    <div class="support-box">
        Helpline: <a href="tel:0794877125">0794877125</a> • Kisii
    </div>
</div>

<script>
    (function() {
        var el = document.getElementById('err-text');
        if (el) {
            var txt = el.innerText.trim();
            if (!txt || txt.indexOf('$(') !== -1) {
                el.innerText = 'Could not authenticate. Redirecting back to login in 3 seconds...';
            }
        }
        var url = "$(link-login)";
        if (url && url.indexOf('$(') === -1) {
            document.getElementById('return-btn').setAttribute('href', url);
        }
    })();
</script>

</body>
</html>
