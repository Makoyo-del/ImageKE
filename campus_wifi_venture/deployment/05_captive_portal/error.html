<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connection Notice — Makoyocart CampusNet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #090a0e;
            --bg-card: rgba(17, 19, 26, 0.94);
            --brand-orange: #ff5414;
            --brand-orange-hover: #ff6f38;
            --brand-orange-glow: rgba(255, 84, 20, 0.45);
            --brand-ember: #e03a00;
            --text-pure: #ffffff;
            --text-high: #f1f5f9;
            --text-mid: #cbd5e1;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(circle at 80% 15%, rgba(255, 84, 20, 0.22) 0%, transparent 60%),
                radial-gradient(circle at 20% 85%, rgba(239, 68, 68, 0.14) 0%, transparent 50%);
            color: var(--text-high);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            text-align: center;
            line-height: 1.6;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: blur(28px);
            border: 1.5px solid var(--border-glass);
            border-radius: 28px;
            padding: 34px 24px;
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(255, 84, 20, 0.15);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ef4444, transparent);
        }

        .icon-box {
            width: 64px;
            height: 64px;
            background: rgba(239, 68, 68, 0.12);
            border: 1.5px solid rgba(239, 68, 68, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .edition-badge {
            display: inline-block;
            background: var(--brand-orange);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--text-pure);
            letter-spacing: -0.5px;
        }

        .title span {
            color: var(--brand-orange);
        }

        .error-message-box {
            background: rgba(239, 68, 68, 0.08);
            border: 1.5px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin: 18px 0 24px;
            font-size: 13.5px;
            font-weight: 600;
            color: #fca5a5;
            line-height: 1.5;
        }

        .btn-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, var(--brand-ember) 0%, var(--brand-orange) 100%);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 25px -4px var(--brand-orange-glow);
            transition: all 0.2s;
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px -4px rgba(255, 84, 20, 0.6);
        }

        .support-box {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border-glass);
            font-size: 12.5px;
            color: var(--text-mid);
        }

        .support-box strong {
            color: var(--text-pure);
        }

        .support-phone {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--brand-orange);
            font-weight: 800;
            text-decoration: none;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <span class="edition-badge">THE 2026 EDITION</span>
    <div class="icon-box">⚠️</div>

    <h1 class="title">Connection <span>Notice</span></h1>

    <div class="error-message-box">
        <span id="mt-error-raw">$(error)</span>
    </div>

    <a id="btn-login-return" href="login.html" class="btn-cta">
        ⚡ Return to Login
    </a>

    <div class="support-box">
        <strong>Makoyocart Ventures</strong> • Reg: BN-WLSP9KP9<br>
        24/7 Helpline: <a class="support-phone" href="tel:0794877125">📞 0794877125</a> • Kisii
    </div>
</div>

<script>
    (function() {
        var raw = document.getElementById('mt-error-raw');
        var btn = document.getElementById('btn-login-return');
        if (raw) {
            var txt = raw.innerText.trim();
            if (!txt || txt.indexOf('$(') !== -1 || txt.startsWith('$(')) {
                raw.innerText = 'Session expired or authentication needed. Please log in or choose a Wi-Fi pass.';
            }
        }
        var loginUrl = "$(link-login)";
        if (loginUrl && loginUrl.indexOf('$(') === -1) {
            btn.setAttribute('href', loginUrl);
        }
    })();
</script>

</body>
</html>
