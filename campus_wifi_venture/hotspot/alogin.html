<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging you in...</title>
    <meta http-equiv="refresh" content="2; url=$(link-orig)">
    <style>
        body {
            background-color: #0a0f1d;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            padding: 30px;
            background: rgba(18, 26, 47, 0.9);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h2 style="font-size: 18px; margin-bottom: 8px;">Access Granted!</h2>
        <p style="color: #94a3b8; font-size: 14px;">Redirecting you to the web...</p>
        <p style="margin-top: 14px;"><a href="$(link-orig)" style="color: #60a5fa; font-size: 12px;">Click here if not redirected automatically</a></p>
    </div>
</body>
</html>
