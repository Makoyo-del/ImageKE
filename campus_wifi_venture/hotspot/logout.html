<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logged Out — Makoyocart CampusNet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0d0e12;
            --bg-card: rgba(18, 20, 27, 0.92);
            --brand-orange: #f15c22;
            --brand-ember: #ff4500;
            --brand-orange-glow: rgba(241, 92, 34, 0.45);
            --text-primary: #ffffff;
            --text-secondary: #9ea3b0;
            --text-muted: #646a7a;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(circle at 80% 15%, rgba(241, 92, 34, 0.22) 0%, transparent 60%),
                radial-gradient(circle at 20% 85%, rgba(255, 152, 0, 0.1) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--brand-orange), transparent);
        }

        .edition-badge {
            display: inline-block;
            background: var(--brand-orange);
            color: #ffffff;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(241, 92, 34, 0.12);
            border: 1.5px solid rgba(241, 92, 34, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 26px;
            color: var(--brand-orange);
            box-shadow: 0 0 20px rgba(241, 92, 34, 0.3);
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -0.4px;
        }

        .title span {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            color: var(--brand-orange);
        }

        .sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
            text-align: left;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .stat-box .label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-box .val {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .btn-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, var(--brand-ember) 0%, var(--brand-orange) 100%);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 24px -4px var(--brand-orange-glow);
            transition: all 0.2s;
        }

        .btn-cta:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px -3px rgba(241, 92, 34, 0.6);
        }

        .footer-info {
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .footer-info strong {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="card">
    <span class="edition-badge">THE 2026 EDITION</span>
    <div class="icon-box">🔒</div>

    <h1 class="title">Session <span>Completed</span></h1>
    <p class="sub">You have disconnected from <strong>Makoyocart CampusNet</strong>.</p>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="label">Total Uptime</div>
            <div class="val" id="stat-uptime">$(uptime)</div>
        </div>
        <div class="stat-box">
            <div class="label">Downloaded</div>
            <div class="val" id="stat-bytes">$(bytes-out-nice)</div>
        </div>
        <div class="stat-box">
            <div class="label">Device IP</div>
            <div class="val" id="stat-ip">$(ip)</div>
        </div>
        <div class="stat-box">
            <div class="label">Device MAC</div>
            <div class="val" id="stat-mac" style="font-size:11px; font-family:monospace;">$(mac)</div>
        </div>
    </div>

    <a id="btn-reconnect" href="login.html" class="btn-cta">
        ⚡ Log Back In / Extend Pass
    </a>

    <div class="footer-info">
        <strong>Makoyocart Ventures</strong> • Reg: BN-WLSP9KP9<br>
        24/7 Helpline: <strong>0712 345 678</strong> • Kisii, Kenya
    </div>
</div>

<script>
    (function() {
        var fields = [
            { id: 'stat-uptime', preview: '45m 12s' },
            { id: 'stat-bytes', preview: '218.4 MB' },
            { id: 'stat-ip', preview: '192.168.88.254' },
            { id: 'stat-mac', preview: '6C:29:95:A1:B2:C3' }
        ];
        fields.forEach(function(item) {
            var el = document.getElementById(item.id);
            if (el) {
                var v = el.innerText.trim();
                if (!v || v.indexOf('$(') !== -1 || v.startsWith('$(')) {
                    el.innerText = item.preview;
                }
            }
        });
        var loginUrl = "$(link-login)";
        if (loginUrl && loginUrl.indexOf('$(') === -1) {
            document.getElementById('btn-reconnect').setAttribute('href', loginUrl);
        }
    })();
</script>

</body>
</html>
