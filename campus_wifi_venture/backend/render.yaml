services:
  - type: web
    name: campusnet-billing-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ADMIN_API_KEY
        value: campusnet_secret_admin_2026
