<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login Failed — Makoyocart CampusNet</title>
    <meta http-equiv="refresh" content="3; url=$(link-login)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0d0e12;
            --bg-card: rgba(18, 20, 27, 0.92);
            --brand-orange: #f15c22;
            --brand-ember: #ff4500;
            --brand-orange-glow: rgba(241, 92, 34, 0.45);
            --text-primary: #ffffff;
            --text-secondary: #9ea3b0;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(241, 92, 34, 0.22) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(239, 68, 68, 0.12) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 34px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ef4444, transparent);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(239, 68, 68, 0.12);
            border: 1.5px solid rgba(239, 68, 68, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 26px;
            color: #ef4444;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .title span {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            color: var(--brand-orange);
        }

        .sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .btn-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, var(--brand-ember) 0%, var(--brand-orange) 100%);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 24px -4px var(--brand-orange-glow);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-box">✕</div>
    <h1 class="title">Login <span>Unsuccessful</span></h1>
    <p class="sub" id="err-text">$(error)</p>

    <a id="return-btn" href="login.html" class="btn-cta">
        ⚡ Return to Login
    </a>
</div>

<script>
    (function() {
        var el = document.getElementById('err-text');
        if (el) {
            var txt = el.innerText.trim();
            if (!txt || txt.indexOf('$(') !== -1) {
                el.innerText = 'Could not authenticate. Redirecting back to login in 3 seconds...';
            }
        }
        var url = "$(link-login)";
        if (url && url.indexOf('$(') === -1) {
            document.getElementById('return-btn').setAttribute('href', url);
        }
    })();
</script>

</body>
</html>
