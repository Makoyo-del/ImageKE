<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connecting — Makoyocart CampusNet</title>
    <meta http-equiv="refresh" content="1; url=$(link-login)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0d0e12;
            --bg-card: rgba(18, 20, 27, 0.92);
            --brand-orange: #f15c22;
            --brand-ember: #ff4500;
            --brand-orange-glow: rgba(241, 92, 34, 0.45);
            --text-primary: #ffffff;
            --text-secondary: #9ea3b0;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            background-image: radial-gradient(circle at 50% 30%, rgba(241, 92, 34, 0.22) 0%, transparent 60%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 36px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
        }

        .spinner {
            width: 46px;
            height: 46px;
            border: 3px solid rgba(241, 92, 34, 0.2);
            border-top: 3px solid var(--brand-orange);
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .title span {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            color: var(--brand-orange);
        }

        .sub {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .sub a {
            color: var(--brand-orange);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="spinner"></div>
    <h1 class="title">Makoyocart <span>CampusNet</span></h1>
    <p class="sub">Opening high-speed WiFi portal...<br><a id="manual-link" href="$(link-login)">Click here if not redirected</a></p>
</div>

<script>
    (function() {
        var url = "$(link-login)";
        if (url && url.indexOf('$(') === -1) {
            window.location.href = url;
        } else {
            document.getElementById('manual-link').setAttribute('href', 'login.html');
        }
    })();
</script>

</body>
</html>
