<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connected — Makoyocart CampusNet</title>
    <meta http-equiv="refresh" content="2; url=$(link-orig)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0d0e12;
            --bg-card: rgba(18, 20, 27, 0.92);
            --brand-orange: #f15c22;
            --brand-ember: #ff4500;
            --brand-orange-glow: rgba(241, 92, 34, 0.45);
            --profit-green: #00e676;
            --profit-green-bg: rgba(0, 230, 118, 0.12);
            --text-primary: #ffffff;
            --text-secondary: #9ea3b0;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(241, 92, 34, 0.22) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(0, 230, 118, 0.15) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 36px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 25%;
            right: 25%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--profit-green), transparent);
        }

        .success-icon-box {
            width: 68px;
            height: 68px;
            background: var(--profit-green-bg);
            border: 2px solid var(--profit-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: var(--profit-green);
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.4);
            animation: bounceIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes bounceIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .sub {
            font-size: 13.5px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn-browse {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, var(--brand-ember) 0%, var(--brand-orange) 100%);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 8px 24px -4px var(--brand-orange-glow);
            transition: all 0.2s;
        }

        .btn-browse:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px -3px rgba(241, 92, 34, 0.6);
        }

        .manual-link {
            display: block;
            margin-top: 14px;
            font-size: 11.5px;
            color: var(--text-secondary);
            text-decoration: none;
        }

        .manual-link span {
            color: var(--brand-orange);
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="success-icon-box">✓</div>
    <h1 class="title">Access Granted!</h1>
    <p class="sub">You are now connected to <strong>Makoyocart CampusNet</strong> at full 15 Mbps speed. Redirecting you to the web...</p>

    <a id="redirect-link" href="$(link-orig)" class="btn-browse">
        ⚡ Start Browsing Now
    </a>

    <a id="manual-sublink" href="$(link-orig)" class="manual-link">
        Auto-redirecting in 2s... or <span>click here</span>
    </a>
</div>

<script>
    (function() {
        var btn = document.getElementById('redirect-link');
        var sub = document.getElementById('manual-sublink');
        var href = btn.getAttribute('href');
        if (!href || href.indexOf('$(') !== -1) {
            btn.setAttribute('href', 'https://www.google.com');
            sub.setAttribute('href', 'https://www.google.com');
        }
    })();
</script>

</body>
</html>
